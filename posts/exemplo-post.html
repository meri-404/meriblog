<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criando o meriblog</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500;1,600&family=Karla:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../assets/css/style.css">
<style>
  /* estilos específicos de página de post, além do style.css principal */
  .post-hero { padding: 56px 0 30px; }
  .post-hero .call-number { display:block; font-family: var(--font-mono); font-size:0.78rem; color: var(--gold); margin-bottom:14px; }
  .post-hero h1 { font-family: var(--font-display); font-size: clamp(2rem, 4vw, 2.8rem); margin: 0 0 14px; line-height:1.15; }
  .post-meta { color: var(--taupe); font-size:0.9rem; }
  .post-body { max-width: 68ch; margin: 0 auto; padding-bottom: 80px; }
  .post-body p { margin: 0 0 20px; }
  .post-body h2 { font-family: var(--font-display); font-size:1.5rem; margin: 40px 0 16px; }
  .post-body code { font-family: var(--font-mono); background: var(--card); border:1px solid var(--paper-line); padding: 2px 6px; border-radius:4px; font-size:0.9em; }
  .post-body pre { background: var(--espresso); color: var(--cream); padding: 20px; border-radius: 10px; overflow-x:auto; font-family: var(--font-mono); font-size:0.85rem; }
  .back-link { display:inline-block; margin: 40px 0 0; font-weight:700; color: var(--peach-deep); text-decoration:none; }
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="../index.html" class="logo">meri<span>blog</span></a>
    <nav>
      <ul class="nav-links">
        <li><a href="../index.html#sobre">sobre</a></li>
        <li><a href="../index.html#posts">posts</a></li>
        <li><a href="../index.html#projeto">projeto</a></li>
        <li><a href="../index.html#contato">contato</a></li>
      </ul>
    </nav>
  </div>
</header>

<main>
  <section class="post-hero wrap">
    <span class="call-number">BLG.2026.01</span>
    <h1>Criando o blog</h1>
    <p class="post-meta">22 de agosto de 2026</p>
  </section>

  <section class="wrap">
    <div class="post-body">
 
      <p>
        Eu estou desempregada - esse é um fato importante sobre a criação desse blog.
      </p>

    

      <a href="../index.html#posts" class="back-link">← voltar para os posts</a>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap footer-grid">
    <p class="footer-note">meriblog © 2026 — feito com Python, SQL, Git e um pouco de pêssego</p>
    <ul class="social-links">
      <li><a href="https://github.com/SEU-USUARIO" target="_blank" rel="noopener">GitHub</a></li>
      <li><a href="https://linkedin.com/in/SEU-USUARIO" target="_blank" rel="noopener">LinkedIn</a></li>
    </ul>
  </div>
</footer>

</body>
</html>
