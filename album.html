      COMO ADICIONAR UMA NOVA FOTO:
      1. Suba o arquivo de imagem em assets/img/ (nomes sem espaço/acento, ex: gato-sol.jpg)
      2. Copie um bloco <figure class="polaroid">...</figure> inteiro e cole abaixo dele
      3. Dentro de <div class="photo-frame">, troque o texto placeholder por:
         <img src="assets/img/SEU-ARQUIVO.jpg" alt="descrição curta da foto">
      4. Troque o título e o texto da legenda em <figcaption>
    -->

    <div class="album-grid">
